# dsh bundle patch for dsh-academic-research (applied automatically on install).
#
# This backend registers on the SAME `ctx.compaction` service as the built-in
# `dsh-compaction-basic`, so exactly one of them may be enabled per realm.
# Disabling the built-in here is what makes the science backend the provider.
#
# PRESET DEPLOYMENTS (an agent preset owns its own compaction realm) must NOT
# let this host-plane row start: the preset's engine and this one would both
# hook `agent/pre-step` for every session and race for the same compaction
# decision. Disable the inserted row in the profile's own cordis.patch.yml and
# mount the backend inside the preset instead — see README "部署形态 A".
- id: compaction-basic
  disabled: true
- insert:
  - id: academic-research
    name: 'dsh-academic-research'
    config:
      domain: general
      summaryLanguage: auto
      # One call, never chunked: each chunk is a full model call (~2 minutes
      # measured) on top of the merge, and the region is already bounded by
      # thresholdRatio. Same shape as the built-in compaction-basic.
      recursive: false
      chunkMessages: 160
      # Pressure must land inside the real input limit:
      #   thresholdRatio x contextWindow < provider limit - maxTokens
      # Calibrated for deepseek-flash:
      #   0.7 x 1000000 = 700000 < 1048576 - 65536 = 983040
      thresholdRatio: 0.7
      retainRatio: 0.16
      # Floor is 32768 (measured: 8192 truncates the six-section checkpoint). 65536 leaves
      # room for the reasoning tokens that share this budget — a real call spent 20344 of
      # its 24273 output tokens on reasoning.
      maxTokens: 65536
      auto: true
